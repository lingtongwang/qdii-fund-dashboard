name: QDII Fund Daily Data Refresh

on:
  schedule:
    # 每天北京时间 19:30 (UTC 11:30) 自动抓取最新净值与限额
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # 支持在 GitHub 页面手动点击一键运行

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System Dependencies (pdftotext)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install Dependencies
        run: |
          npm install

      - name: 1. Run Daily Fast Ingest (NAV & Purchase Limits)
        run: |
          node --experimental-sqlite backend/jobs/daily_fast_refresh.mjs

      - name: 2. Run Daily Multi-Source Dual Verification (Tencent & Danjuan & PDF Limits)
        run: |
          node --experimental-sqlite backend/qa/dual_source_verifier.mjs --mode=daily

      - name: 3. Run DataGuard Quality Gate
        run: |
          node --experimental-sqlite backend/qa/data_guard.mjs

      - name: 4. Build & Verify Static Distribution
        run: |
          npm run build

      - name: 5. Commit & Push Updated Database & Static JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/fund.db* data/funds.json public/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automated daily QDII fund data update [skip ci]" && git push)
